<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="leftLens">
      <circle cx="130" cy="180" r="60"/>
    </clipPath>
    <clipPath id="rightLens">
      <circle cx="270" cy="180" r="60"/>
    </clipPath>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer border circle (Crimson) -->
  <circle cx="200" cy="200" r="185" fill="#f1eee1" stroke="#af5a4b" stroke-width="16"/>

  <!-- Background circle (Cream) -->
  <circle cx="200" cy="200" r="180" fill="#f1eee1"/>

  <!-- GILMAN text (top, dark teal) -->
  <text x="200" y="95" font-family="Arial, sans-serif" font-size="56" font-weight="bold" text-anchor="middle" fill="#2b4744" letter-spacing="4">GILMAN</text>

  <!-- GLASSES text (dark teal, smaller) -->
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#2b4744" letter-spacing="2">GLASSES</text>

  <!-- Glasses Frame -->
  <!-- Left lens circle (sky blue) -->
  <circle cx="130" cy="180" r="60" fill="#b9cdcc" stroke="#af5a4b" stroke-width="8"/>

  <!-- Right lens circle (sky blue) -->
  <circle cx="270" cy="180" r="60" fill="#b9cdcc" stroke="#af5a4b" stroke-width="8"/>

  <!-- Bridge between lenses (crimson) -->
  <rect x="190" y="170" width="20" height="20" fill="#af5a4b" rx="3"/>

  <!-- Left temple arm (crimson) -->
  <path d="M 70 180 L 130 180" stroke="#af5a4b" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Right temple arm (crimson) -->
  <path d="M 270 180 L 330 180" stroke="#af5a4b" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Mountain landscape in LEFT lens -->
  <g clip-path="url(#leftLens)">
    <!-- Sky gradient effect -->
    <rect x="70" y="120" width="120" height="120" fill="#b9cdcc"/>

    <!-- Mountain peaks (dark teal) -->
    <polygon points="80,200 110,140 140,170 160,120 180,180 200,200" fill="#2b4744" opacity="0.8"/>

    <!-- Snow caps (white) -->
    <polygon points="140,170 150,150 160,170" fill="#ffffff" opacity="0.7"/>
    <polygon points="160,120 170,100 180,120" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Mountain landscape in RIGHT lens -->
  <g clip-path="url(#rightLens)">
    <!-- Sky gradient effect -->
    <rect x="210" y="120" width="120" height="120" fill="#b9cdcc"/>

    <!-- Mountain peaks (dark teal) -->
    <polygon points="220,200 250,140 280,170 300,120 320,180 340,200" fill="#2b4744" opacity="0.8"/>

    <!-- Snow caps (white) -->
    <polygon points="280,170 290,150 300,170" fill="#ffffff" opacity="0.7"/>
    <polygon points="300,120 310,100 320,120" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Lens shine/glare effect -->
  <ellipse cx="110" cy="160" rx="18" ry="22" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="250" cy="160" rx="18" ry="22" fill="#ffffff" opacity="0.4"/>

  <!-- Independent Optical text (italic, teal) -->
  <text x="200" y="285" font-family="Georgia, serif" font-size="28" font-style="italic" text-anchor="middle" fill="#657d77">Independent Optical</text>

  <!-- Decorative dots -->
  <circle cx="155" cy="305" r="3" fill="#2b4744"/>
  <circle cx="245" cy="305" r="3" fill="#2b4744"/>

  <!-- ISSAQUAH WASHINGTON text -->
  <text x="200" y="335" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#2b4744" letter-spacing="2">ISSAQUAH</text>
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#2b4744" letter-spacing="1">WASHINGTON</text>
</svg>